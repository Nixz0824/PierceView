    <g transform="translate(0 356)">
      <rect x="0" y="0" width="70" height="48" rx="10" fill="#FFFDF7" stroke="#111111" stroke-width="3"/>
      <text x="35" y="32" fill="#111111" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">F8</text>
      <path d="M80 24H125" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
