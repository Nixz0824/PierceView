<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">寸镜 PierceView — 按住 F8 查看并操作后台窗口</title>
  <desc id="desc">Bilingual monochrome hero showing two overlapping application windows and a circular portal into the window behind.</desc>

  <rect width="1200" height="480" rx="28" fill="#F4F1E8"/>
  <path d="M0 28A28 28 0 0 1 28 0h1144a28 28 0 0 1 28 28v424a28 28 0 0 1-28 28H28A28 28 0 0 1 0 452Z" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M56 416H684" stroke="#111111" stroke-width="2"/>

  <rect x="56" y="48" width="378" height="34" rx="17" fill="#111111"/>
  <text x="245" y="70" fill="#F4F1E8" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.8">WINDOWS TRAY UTILITY · WINDOWS 托盘工具</text>

  <text x="56" y="173" fill="#111111" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="82" font-weight="800">寸镜</text>
  <text x="56" y="222" fill="#111111" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="38" font-weight="650" letter-spacing="0.8">PierceView</text>

  <text x="56" y="292" fill="#111111" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="27" font-weight="650">按住 F8，直接查看并操作后台窗口。</text>
  <text x="56" y="330" fill="#4E4C47" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="24">Hold F8 to view and interact with the window behind.</text>

  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="650">
    <text x="56" y="390" fill="#111111">v1.0.0</text>
    <circle cx="174" cy="385" r="3" fill="#111111"/>
    <text x="190" y="390" fill="#111111">Windows 10 / 11</text>
    <circle cx="331" cy="385" r="3" fill="#111111"/>
    <text x="347" y="390" fill="#111111">单层稳定内核 / Stable single-layer core</text>
  </g>

  <g transform="translate(704 38)">
    <text x="205" y="18" fill="#4E4C47" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">紧贴后方一层 / ONE LAYER BEHIND</text>

    <rect x="16" y="40" width="358" height="258" rx="20" fill="#FFFDF7" stroke="#111111" stroke-width="7"/>
    <path d="M20 94H370" stroke="#111111" stroke-width="7"/>
