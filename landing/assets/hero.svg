    <circle cx="75" cy="68" r="8" fill="#111111"/>
    <circle cx="102" cy="68" r="8" fill="#111111"/>
    <text x="58" y="202" fill="#111111" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800">ABC</text>
    <path d="M57 231H259M57 260H309" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

    <rect x="89" y="122" width="370" height="278" rx="22" fill="#111111" stroke="#111111" stroke-width="7"/>
    <path d="M93 180H455V144a18 18 0 0 0-18-18H111a18 18 0 0 0-18 18Z" fill="#FFFDF7"/>
    <path d="M93 180H455" stroke="#111111" stroke-width="7"/>
    <circle cx="123" cy="152" r="8" fill="#111111"/>
    <circle cx="150" cy="152" r="8" fill="#111111"/>
    <circle cx="177" cy="152" r="8" fill="#111111"/>

    <circle cx="276" cy="286" r="84" fill="#FFFDF7" stroke="#F4F1E8" stroke-width="6"/>
