<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">寸镜 PierceView 2.1.0 CPU 版本功能提升</title>
  <desc id="desc">Bilingual technical illustration of a fixed display surface, one-frame hand-off, and background-only input.</desc>

  <rect width="1200" height="520" rx="28" fill="#F4F1E8"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="48" y="62" fill="#111111" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="800">2.1.0 CPU 版本 / CPU EDITION</text>
  <text x="48" y="99" fill="#4E4C47" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19">稳定移动、同步换帧、准确交互 / Stable motion, synchronized frames, precise interaction</text>
  <rect x="970" y="42" width="182" height="56" rx="28" fill="#111111"/>
  <text x="1061" y="77" fill="#FFFDF7" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">无需独显 / NO dGPU</text>

  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <g transform="translate(48 138)">
      <rect width="344" height="326" rx="20" fill="#FFFDF7" stroke="#111111" stroke-width="2"/>
      <circle cx="30" cy="30" r="16" fill="#111111"/>
      <text x="30" y="36" fill="#FFFDF7" font-size="16" font-weight="800" text-anchor="middle">1</text>

      <rect x="64" y="58" width="216" height="122" rx="13" fill="none" stroke="#111111" stroke-width="5"/>
      <path d="M66 88H278" stroke="#111111" stroke-width="5"/>
      <circle cx="83" cy="73" r="4" fill="#111111"/>
      <circle cx="98" cy="73" r="4" fill="#111111"/>
      <circle cx="113" cy="73" r="4" fill="#111111"/>
      <circle cx="172" cy="135" r="31" fill="#111111"/>
      <path d="M45 199H299" stroke="#4E4C47" stroke-width="2" stroke-dasharray="7 7"/>
      <path d="M60 189v20M284 189v20" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

      <text x="172" y="243" fill="#111111" font-size="23" font-weight="800" text-anchor="middle">固定显示层</text>
      <text x="172" y="272" fill="#111111" font-size="18" font-weight="700" text-anchor="middle">Fixed display surface</text>
      <text x="172" y="302" fill="#4E4C47" font-size="15" text-anchor="middle">减少旧路径残影与窗口闪现</text>
      <text x="172" y="322" fill="#4E4C47" font-size="14" text-anchor="middle">Reduces stale trails and surface flashes</text>
    </g>

    <g transform="translate(428 138)">
      <rect width="344" height="326" rx="20" fill="#111111" stroke="#111111" stroke-width="2"/>
      <circle cx="30" cy="30" r="16" fill="#FFFDF7"/>
      <text x="30" y="36" fill="#111111" font-size="16" font-weight="800" text-anchor="middle">2</text>

      <rect x="59" y="64" width="74" height="96" rx="10" fill="none" stroke="#FFFDF7" stroke-width="4"/>
      <rect x="135" y="64" width="74" height="96" rx="10" fill="none" stroke="#7B7870" stroke-width="4" stroke-dasharray="7 7"/>
      <rect x="211" y="64" width="74" height="96" rx="10" fill="#FFFDF7"/>
      <path d="M87 113h18M164 113h17M240 113h18" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
      <path d="M102 113h150" stroke="#FFFDF7" stroke-width="3"/>
      <path d="m244 105 9 8-9 8" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="172" y="243" fill="#FFFDF7" font-size="23" font-weight="800" text-anchor="middle">单帧同步</text>
      <text x="172" y="272" fill="#FFFDF7" font-size="18" font-weight="700" text-anchor="middle">One-frame hand-off</text>
      <text x="172" y="302" fill="#D8D4CA" font-size="15" text-anchor="middle">每轮只提交一张最终画面</text>
      <text x="172" y="322" fill="#D8D4CA" font-size="14" text-anchor="middle">One final presentation per update</text>
    </g>

    <g transform="translate(808 138)">
      <rect width="344" height="326" rx="20" fill="#FFFDF7" stroke="#111111" stroke-width="2"/>
      <circle cx="30" cy="30" r="16" fill="#111111"/>
      <text x="30" y="36" fill="#FFFDF7" font-size="16" font-weight="800" text-anchor="middle">3</text>

      <rect x="66" y="51" width="212" height="126" rx="13" fill="#111111"/>
      <circle cx="172" cy="112" r="42" fill="#FFFDF7"/>
      <path d="m170 75 23 68-21-10-13 22-12-7 13-22-20-12Z" fill="#111111" stroke="#FFFDF7" stroke-width="3" stroke-linejoin="round"/>
      <path d="M116 191h112" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
      <path d="m217 182 11 9-11 9" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="172" y="243" fill="#111111" font-size="23" font-weight="800" text-anchor="middle">后台独占交互</text>
      <text x="172" y="272" fill="#111111" font-size="18" font-weight="700" text-anchor="middle">Background-only input</text>
      <text x="172" y="302" fill="#4E4C47" font-size="15" text-anchor="middle">滚轮与点击准确送达后方窗口</text>
      <text x="172" y="322" fill="#4E4C47" font-size="14" text-anchor="middle">Scroll and click reach the window behind</text>
    </g>
  </g>

  <text x="600" y="498" fill="#4E4C47" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="middle">按住 F8 查看与操作紧贴后方的一层普通窗口 / Hold F8 to view and interact with one ordinary window directly behind</text>
</svg>
