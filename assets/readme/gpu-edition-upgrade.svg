<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">寸镜 PierceView 2.3.0 GPU 版本功能提升</title>
  <desc id="desc">Bilingual comparison showing four-layer occlusion reconstruction, constrained deep-window promotion, synchronized native input, and dynamic source backfill.</desc>

  <rect width="1200" height="560" rx="28" fill="#111111"/>
  <rect x="1" y="1" width="1198" height="558" rx="27" fill="none" stroke="#F4F1E8" stroke-width="2"/>
  <text x="48" y="61" fill="#FFFDF7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="800">2.3.0 GPU 版本 / GPU EDITION</text>
  <text x="48" y="99" fill="#D8D4CA" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19">从单层透视到最多四层真实遮挡重建 / From one layer to four-layer occlusion reconstruction</text>
  <rect x="970" y="39" width="182" height="58" rx="29" fill="#FFFDF7"/>
  <text x="1061" y="75" fill="#111111" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" text-anchor="middle">-1 · -2 · -3 · -4</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(48 137)">
      <rect width="530" height="352" rx="20" fill="#FFFDF7"/>
      <text x="28" y="43" fill="#111111" font-size="18" font-weight="800">真实边界与遮挡 / REAL BOUNDS &amp; OCCLUSION</text>
      <g transform="translate(38 68)">
        <rect x="212" y="0" width="228" height="176" rx="14" fill="#DDD8CD" stroke="#111111" stroke-width="3"/>
        <path d="M214 34h224" stroke="#111111" stroke-width="3"/>
        <circle cx="230" cy="17" r="4" fill="#111111"/><circle cx="244" cy="17" r="4" fill="#111111"/><circle cx="258" cy="17" r="4" fill="#111111"/>
        <text x="326" y="106" fill="#111111" font-size="40" font-weight="800" text-anchor="middle">-4</text>

        <rect x="144" y="36" width="232" height="176" rx="14" fill="#FFFDF7" stroke="#111111" stroke-width="3"/>
        <path d="M146 70h228" stroke="#111111" stroke-width="3"/>
        <circle cx="162" cy="53" r="4" fill="#111111"/><circle cx="176" cy="53" r="4" fill="#111111"/><circle cx="190" cy="53" r="4" fill="#111111"/>
        <text x="260" y="142" fill="#111111" font-size="40" font-weight="800" text-anchor="middle">-3</text>

        <rect x="72" y="72" width="232" height="176" rx="14" fill="#C7C2B8" stroke="#111111" stroke-width="3"/>
        <path d="M74 106h228" stroke="#111111" stroke-width="3"/>
        <circle cx="90" cy="89" r="4" fill="#111111"/><circle cx="104" cy="89" r="4" fill="#111111"/><circle cx="118" cy="89" r="4" fill="#111111"/>
        <text x="188" y="178" fill="#111111" font-size="40" font-weight="800" text-anchor="middle">-2</text>

        <rect x="0" y="108" width="232" height="176" rx="14" fill="#111111" stroke="#111111" stroke-width="3"/>
        <path d="M2 142h228" stroke="#FFFDF7" stroke-width="3"/>
        <circle cx="18" cy="125" r="4" fill="#FFFDF7"/><circle cx="32" cy="125" r="4" fill="#FFFDF7"/><circle cx="46" cy="125" r="4" fill="#FFFDF7"/>
        <text x="116" y="214" fill="#FFFDF7" font-size="40" font-weight="800" text-anchor="middle">-1</text>
      </g>
      <text x="265" y="326" fill="#4E4C47" font-size="17" text-anchor="middle">浅层覆盖，空白处继续看到更深层 / Shallower wins; gaps reveal deeper layers</text>
    </g>

    <g transform="translate(610 137)">
      <rect width="542" height="352" rx="20" fill="#111111" stroke="#FFFDF7" stroke-width="2"/>
      <g transform="translate(27 27)">
        <circle cx="18" cy="18" r="18" fill="#FFFDF7"/><text x="18" y="24" fill="#111111" font-size="17" font-weight="800" text-anchor="middle">1</text>
        <text x="52" y="17" fill="#FFFDF7" font-size="21" font-weight="800">深层提升 / PROMOTE</text>
        <text x="52" y="42" fill="#D8D4CA" font-size="16">点击可见深层 → 只成为宿主后的新 -1</text>
        <text x="52" y="64" fill="#D8D4CA" font-size="15">Click visible depth → new -1 behind host, never foreground</text>

        <circle cx="18" cy="113" r="18" fill="#FFFDF7"/><text x="18" y="119" fill="#111111" font-size="17" font-weight="800" text-anchor="middle">2</text>
        <text x="52" y="112" fill="#FFFDF7" font-size="21" font-weight="800">输入同步 / SYNC INPUT</text>
        <text x="52" y="137" fill="#D8D4CA" font-size="16">点击 · 滚轮 · 拖放跟随真实新 -1</text>
        <text x="52" y="159" fill="#D8D4CA" font-size="15">Click · wheel · drag follow the physical new -1</text>

        <circle cx="18" cy="208" r="18" fill="#FFFDF7"/><text x="18" y="214" fill="#111111" font-size="17" font-weight="800" text-anchor="middle">3</text>
        <text x="52" y="207" fill="#FFFDF7" font-size="21" font-weight="800">动态补位 / BACKFILL</text>
        <text x="52" y="232" fill="#D8D4CA" font-size="16">关闭或最小化来源后，从更深处补齐</text>
        <text x="52" y="254" fill="#D8D4CA" font-size="15">Replace closed or minimized sources from deeper candidates</text>

        <path d="M0 283h488" stroke="#F4F1E8" stroke-width="1" opacity=".35"/>
        <text x="0" y="315" fill="#FFFDF7" font-size="16" font-weight="700">一张固定 GPU 显示层 · CPU 自动回退</text>
        <text x="488" y="315" fill="#D8D4CA" font-size="15" text-anchor="end">ONE SURFACE · CPU FALLBACK</text>
      </g>
    </g>
  </g>

  <text x="600" y="531" fill="#D8D4CA" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="middle">超过 -4 不识别 · 文件资源管理器稳定性修复 · 受保护或特殊 GPU 表面仍受系统边界限制 / Beyond -4 ignored · File Explorer stability fix · Protected GPU surfaces remain limited</text>
</svg>
